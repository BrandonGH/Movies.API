services:
  movies.api:
    image: movies.api
    container_name: movies-api
    build:
      context: .
      dockerfile: Movies.API/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=movies;Username=moviesadmin;Password=d0rR17T0JfuZ;"
    ports:
      - "5043:5043"
  movies.client:
    image: movies.client:dev
    container_name: movies-client
    restart: unless-stopped
    ports:
      - "4200:4200"
  postgres:
    image: postgres:18
    container_name: movies-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: moviesadmin
      POSTGRES_PASSWORD: d0rR17T0JfuZ
      POSTGRES_DB: movies
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moviesadmin -d movies"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata: